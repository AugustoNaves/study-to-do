name: Lembrete diário

on:
  schedule:
    # 22:00 UTC = 19:00 em Brasília. O GitHub pode atrasar alguns minutos.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar web-push
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7

      - name: Enviar notificação
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/enviar-lembrete.mjs

      # O GitHub desliga tarefas agendadas após 60 dias sem atividade no repositório.
      # Um commit mensal pequeno mantém o lembrete vivo.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "keepalive: manter lembrete ativo"
            git push
          fi
